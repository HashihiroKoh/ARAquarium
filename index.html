<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Aquarium</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com"
        }
      }
    </script>
    <script>
      // クジラの移動ロジックをA-Frameのコンポーネントとして登録
      AFRAME.registerComponent("whale-move", {
        init: function () {
          this.radiusX = 15;
          this.radiusY = 12;
          this.angle = -3;
        },
        tick: function (time, timeDelta) {
          // 毎フレーム実行される処理
          this.angle += 0.2; // 移動速度の調整
          if (this.angle >= 360 || this.angle <= -360) {
            this.angle = 0;
          }

          let radian = (this.angle * Math.PI) / 180;
          var x = Math.cos(radian) * this.radiusX;
          var z = Math.sin(radian) * this.radiusY;

          this.el.setAttribute("position", { x: -x, y: 1, z: z });
          this.el.setAttribute("rotation", { x: 0, y: this.angle, z: 0 });
        },
      });
      // その他魚の動的コンポーネントを登録
      AFRAME.registerComponent("fish-move", {
        init: function () {
          this.radius= 5+ Math.random() * 3;
          this.speed = (2.5 + Math.random() * 3) * 0.1;
          this.angle= Math.random() * 360;
          this.posy = 0.2 + Math.random() * 2.0;
          this.direction = Math.random() > 0.5 ? 1 : -1; // 回転方向（時計回りor反時計回り）
        },
        tick: function (time, timeDelta) {
          // 毎フレーム実行される処理
          this.angle+= this.speed * this.direction; // 移動速度の調整
          if (this.angle >= 360) this.an -= 360;
          if (this.angle <= -360) this.an += 360;

          let radian = (this.angle * Math.PI) / 180;
          var x = Math.cos(radian) * this.radius;
          var z = Math.sin(radian) * this.radius;
 
          this.el.setAttribute("position", { x: -x, y:this.posy, z: z });
          this.el.setAttribute("rotation", {
            x: 0,
            y: this.angle + (this.direction == 1 ? 180 : 0), // 進行方向を向くための角度調整
            z: 0,
          });
        },
});
      // イワシ専用の動的コンポーネントを登録
      AFRAME.registerComponent("sardine-behavior", {
        schema: {
          index: { type: "int", default: 0 },
        },
        init: function () {
          // --- ばらつき（ランダム要素）の設定 ---
          this.speed = (3.5 + Math.random() * 3) * 0.1;
          this.an = Math.random() * 360; // 初期角度

          this.rx = 1; // 基本のX半径
          this.ry = 1; // 基本のZ半径

          // インデックスに応じた配置計算（12列で折り返し）
          const cols = 10;
          const col = Math.floor(this.data.index / cols);
          const row = this.data.index % cols;

          // 回転の中心座標
          this.centerX = 0 + 0.3 * col;
          this.centerY = 0 + 0.5 * row;
          this.centerZ = -5;

          // 上下（波打ち）の動きのパラメーター
          this.waveAmplitude = 0.3;
          this.waveSpeed = 2;
        },

        // 毎フレーム（ブラウザの最適タイミング）で実行される処理
        tick: function (time, timeDelta) {
          this.an += this.speed;
          if (this.an >= 360) this.an -= 360;

          let radian = (this.an * Math.PI) / 180;

          const xx = this.centerX + Math.cos(radian) * this.rx;
          const zz = this.centerZ + Math.sin(radian) * this.ry;
          // 上下位置（Y軸）の計算
          const yy =
            this.centerY +
            Math.sin(radian * this.waveSpeed) * this.waveAmplitude;

          // 位置と回転を更新
          this.el.setAttribute("position", { x: xx, y: yy, z: zz });
          this.el.setAttribute("rotation", { x: 0, y: -this.an + 180, z: 0 });
        },
      });
      // エンゼルフィッシュ専用の動的コンポーネントを登録
      AFRAME.registerComponent("angelfish-behavior", {
        init: function () {
          // 1. スピードに個性を出す
          this.speed = (1.5 + Math.random() * 3) * 0.1;
          // 2. スタート位置
          this.an = Math.random() * 360;
          // 3. 上下（波打ち）の揺れ幅に個性を出す
          this.waveAmplitude = 0.5 + Math.random() * 0.7;
          // 4. 波打ちの速さに個性を出す
          this.waveSpeed = 3 + Math.random() * 2;

          // 基本のX半径・Z半径
          this.rx = 5 + Math.random() * 3;
          this.ry = 5 + Math.random() * 3;

          // 回転の中心座標を設定
          this.centerX = Math.random() * 2;
          this.centerY = Math.random() * 2;
          this.centerZ = 0;

          // 回転方向（時計回りor反時計回り）
          this.direction = Math.random() > 0.5 ? 1 : -1;
        },

        // 毎フレーム実行される処理
        tick: function (time, timeDelta) {
          this.an += this.speed * this.direction;
          if (this.an >= 360) this.an -= 360;
          if (this.an <= -360) this.an += 360;

          let radian = (this.an * Math.PI) / 180;

          const xx = this.centerX + Math.cos(radian) * this.rx;
          const zz = this.centerZ + Math.sin(radian) * this.ry;
          // 上下位置（Y軸）の計算
          const yy =
            this.centerY +
            Math.sin(radian * this.waveSpeed) * this.waveAmplitude;

          // 位置と回転を更新（進行方向を向くように計算）
          this.el.setAttribute("position", { x: xx, y: yy, z: zz });
          this.el.setAttribute("rotation", {
            x: 0,
            y: -this.an + (this.direction === 1 ? 180 : 0), // 進行方向を向くための角度調整
            z: 0,
          });
        },
      });
    </script>
    <style>
      #camera-view,
      #aframe-container,
      #wave {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh; 
    height: -webkit-fill-available;
      }
      /* いちばん奥 camera映像*/
      #camera-view {
        object-fit: cover;
        z-index: 1;
      }
      
      /* 真ん中 A-Frameのオブジェクト */
      #aframe-container {
        z-index: 2;
      }
      /* 手前 波（水）を描画 */
      #wave {
        position: fixed;
        left: 0;
        width: 100%;
        height: 100%; /* 高さの調整 */
        background: transparent;
        z-index: 3;
        pointer-events: none;
      }
      #loading-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 12px;
        font-weight: bold;
        color: #ffffff;
        background-color: rgba(0, 0, 0, 0.6);
        padding: 15px 30px;
        border-radius: 8px;
        z-index: 9; /* 一番手前に表示 */
        pointer-events: none; /* クリックを透過 */
        transition: opacity 0.5s ease; /* 消えるときのスムーズなアニメーション */
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden">
    
    </div>
    <!-- ローディングメッセージ -->
    <div id="loading-text">しばらくお待ちください...</div>
    <!-- A-Frame表示エリア -->
    <div id="aframe-container">
      <!-- 背景を透明化するために renderer="alpha: true" を追加 -->
      <a-scene embedded xr-mode-ui="enabled: false" renderer="alpha: true">
        <a-assets>
          <a-asset-item id="angelfish" src="EmperorAngelfish.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item id="gomasaba" src="Gomasaba.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item id="maguro" src="Kihada.glb" crossorigin="anonymous"></a-asset-item>
          <a-asset-item
            id="whale"
            src="Whale.glb"
            crossorigin="anonymous"
          ></a-asset-item>
          <a-asset-item
            id="sardine"
            src="Sardine.glb"
            crossorigin="anonymous"
          ></a-asset-item>
        </a-assets>
        <!-- エンゼルフィッシュ -->
        <a-entity id="angelfish-group" visible="false"></a-entity>
        <!-- クジラ -->
        <a-entity
          id="kujira"
          whale-move
          gltf-model="#whale"
          animation-mixer
          scale="7 7 7"
          visible="false"
        ></a-entity>
        <!-- ゴマサバ -->
        <a-entity id="saba-group" visible="false"></a-entity>
          <!-- キハダマグロ -->
        <a-entity id="kihada-group" visible="false"></a-entity>
        <!-- イワシ -->
        <a-entity id="iwashi-group" visible="false"></a-entity>
      </a-scene>
      <script>
        // シーンの読み込み完了を待ってから実行
        document
          .querySelector("a-scene")
          .addEventListener("loaded", function () {
            //イワシグループの作成
            let group = document.querySelector("#iwashi-group");
            const verticalFish = 10; // 作りたい魚の数
            const horizontalFish = 5;
            for (let i = 0; i < horizontalFish; i++) {
              for (let j = 0; j < verticalFish; j++) {
                let fish = document.createElement("a-entity");
                fish.setAttribute("id", "iwashi" + horizontalFish * i + j);
                fish.setAttribute("gltf-model", "#sardine");
                fish.setAttribute("scale", "2 2 2");
                fish.setAttribute("sardine-behavior", {
                  index: verticalFish * i + j,
                });
                group.appendChild(fish);
              }
            }
            //エンジェルフィッシュグループの作成
            group = document.querySelector("#angelfish-group");
            const angelcnt = 20; // 作りたいエンジェルフィッシュの数
            for (let i = 0; i < angelcnt; i++) {
              let angel = document.createElement("a-entity");
              angel.setAttribute("id", "angel" + i);
              angel.setAttribute("gltf-model", "#angelfish");
              angel.setAttribute("scale", "0.05 0.05 0.05");
              angel.setAttribute("animation-mixer", "");
              angel.setAttribute("angelfish-behavior", {
                index: i,
              });
              group.appendChild(angel);
            }
            //さばグループの作成
            group = document.querySelector("#saba-group");
            const sabacnt = 5; // 作りたいさばの数
            for (let i = 0; i < sabacnt; i++) {
              let saba = document.createElement("a-entity");
              saba.setAttribute("gltf-model", "#gomasaba");
              saba.setAttribute("scale", "3 3 3");
              saba.setAttribute("fish-move","" );
              group.appendChild(saba);
            }
            //キハダマグログループの作成
            group = document.querySelector("#kihada-group");
            const kihadacnt = 3; // 作りたいキハダマグロの数
            for (let i = 0; i < kihadacnt; i++) {
              let kihada = document.createElement("a-entity");
              kihada.setAttribute("gltf-model", "#maguro");
              kihada.setAttribute("scale", "3 3 3");
              kihada.setAttribute("fish-move","" );
              group.appendChild(kihada);
            }
          });
      </script>
    </div>
    
    <div id="wave">
      <script defer type="module">
        const container = document.getElementById("wave");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        container.appendChild(canvas);

        // 波の初期設定
        let waveY = 0; // 開始位置は画面の一番下
        let angle1 = 0; // 波1の位相
        let angle2 = 0; // 波2の位相
        // カスタマイズ用パラメータ
        const riseSpeed = 1.5; // 上昇スピード(数値を大きくすると速くなります）
        const waveHeight = 25; // 波の揺れ幅（高さ）
        const step = 10;           //何ピクセルごとに波を計算するか
        const targetY = -waveHeight - 10; //波の揺れ幅（waveHeight）より上まで上げて完全に隠す
        let isFinished = false; // アニメーションが終了したかを管理するフラグ
        let isLoaded = false;    // A-Frameロード完了フラグ

// アニメーション終了後に画面全体を水の色で満たす関数
function drawFinalWater() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "rgba(100, 230, 255, 0.60)");   // 水面：シアン
      gradient.addColorStop(0.4, "rgba(60, 160, 255, 0.55)");  // 中間：ブルー
      gradient.addColorStop(1, "rgba(40, 100, 220, 0.50)");    // 底：ロイヤルブルー
      
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
        // 画面サイズにCanvasを合わせる
        function resizeCanvas() {
          // 既にアニメーションが始まっている場合は、現在の画面比率を維持してwaveYを再計算
          const oldHeight = canvas.height;
          canvas.width = container.clientWidth;
          canvas.height = container.clientHeight;
          // アニメーション終了後に画面サイズが変わっても水の色を維持する
    if (isFinished) {
        drawFinalWater();
        return;
      }
      if (!isLoaded) {
      waveY = canvas.height;
    } else if (oldHeight > 0) {
        waveY = canvas.height - (oldHeight - waveY);
      } else if (!isLoaded) {
        waveY = canvas.height;
      }
    
        }
        // 初回実行とイベント登録       
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        // アニメーションが終了したら魚表示
        function onAnimationComplete() {
          const fishIds = ["#kujira", "#angelfish-group", "#iwashi-group", "#saba-group","#kihada-group"];
      fishIds.forEach(id => {
        const el = document.querySelector(id);
        if (el) el.setAttribute("visible", "true");
      });
        }

        function animate() {
          if (isFinished) return;
           // 水位の上昇計算（targetYに到達したら終了処理）
      if (waveY <= targetY) {
        isFinished = true;          // フラグを立てて次のループを完全にブロック
        onAnimationComplete();      // 魚を表示
        drawFinalWater();           // 画面全体を水色で塗りつぶして固定
        return;                     // ここで即時終了（requestAnimationFrameを呼ばない）
      }

      // 毎フレーム画面をクリア
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // 水位を上昇
      waveY -= riseSpeed;
      
          // 波1と波2の位相を進める（波の進む速さ）
          angle1 += 0.02;
          angle2 += 0.03;
          // グラデーションの作成（上部から下部へ変化）
          const gradient = ctx.createLinearGradient(
            0,
            Math.max(0, waveY - waveHeight),
            0,
            canvas.height
          );
          gradient.addColorStop(0, "rgba(100, 230, 255, 0.60)"); // 水面：爽やかなシアン
          gradient.addColorStop(0.4, "rgba(60, 160, 255, 0.55)"); // 中間：透き通るブルー
          gradient.addColorStop(1, "rgba(40, 100, 220, 0.50)"); // 底：深みのあるロイヤルブルー
          ctx.fillStyle = gradient;
          
          ctx.beginPath();
          // 左端から右端まで波の線を計算しながら描画
          ctx.moveTo(0, waveY);
          for (let x = 0; x <= canvas.width; x+=step) {
            // 2つのサイン波を合成して複雑な波を作る
            const y1 = Math.sin(x * 0.005 + angle1) * waveHeight;
            const y2 = Math.sin(x * 0.01 - angle2) * (waveHeight * 0.5);
            ctx.lineTo(x, waveY + y1+y2);
          }
          // 画面の右下、左下を結んで、波の下側全体を塗りつぶす
          ctx.lineTo(canvas.width, canvas.height);
          ctx.lineTo(0, canvas.height);
          ctx.closePath();
          ctx.fill();

          requestAnimationFrame(animate);
        }
        const scene = document
          .querySelector("a-scene")
          .addEventListener("loaded", function () {
            isLoaded=true;
            // 読み込み完了後、メッセージをふわっと消す
            const loadingText = document.getElementById("loading-text");
            if (loadingText) {
              loadingText.style.opacity = "0";
              // アニメーション（0.5秒）が終わったら要素自体を削除または非表示にする
              setTimeout(() => {
                loadingText.style.display = "none";
              }, 500);
            }
            animate(); // 波のアニメーションを開始
          });
      </script>
    </div>
    <!-- カメラ映像用のビデオ要素 -->
    <video id="camera-view" autoplay playsinline muted></video>
    <!-- 背面カメラを起動するスクリプト -->
    <script>
      const video = document.getElementById("camera-view");
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({
            video: { facingMode: "environment" },
            audio: false,
          })
          .then((stream) => {
            video.srcObject = stream;
          })
          .catch((error) => {
            console.error("カメラの起動に失敗しました:", error);
          });
      }
    </script>
  </body>
</html>
